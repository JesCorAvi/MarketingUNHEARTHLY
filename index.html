<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Into the Unhearth</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
</head>
<body>
  <a-scene physics="driver: local; friction: 0.0; restitution: 0.0">

    <a-assets timeout="10000"></a-assets>

    <div class="crt-overlay"></div>
    
    <div id="start-screen">
      <div class="glitch-container"><h1 data-text="INTO THE UNHEARTH">INTO THE UNHEARTH</h1></div>
      <div class="instructions">
        <p>ESTADO DE LA MISIÓN: RECUPERAR ACTIVOS E INVESTIGAR DOCUMENTOS.</p>
        <p>[PC]: Ratón para apuntar | Clic para inspeccionar | W A S D para moverte | [E] Linterna.</p>
        <p class="warning">ADVERTENCIA: EL "PERCHERO MÍMICO" TE ACECHA. SÓLO SE DETIENE SI LO MIRAS FIJAMENTE.</p>
      </div>
      <button id="btn-start">INICIAR INMERSIÓN</button>
    </div>

    <div id="ui-container" style="display: none;">
      <div class="hud-box">
        <p>OBJETIVOS: <span id="loot-count" class="highlight">0</span> / 5</p>
        <p>BATERÍA: <span id="battery-level" class="highlight">100%</span></p>
      </div>
    </div>

    <button id="btn-linterna" style="display: none;">LINTERNA [E]</button>
    
    <div id="dpad" style="display: none;">
      <div id="btn-up" class="dpad-btn">W</div>
      <div id="btn-left" class="dpad-btn">A</div>
      <div id="btn-down" class="dpad-btn">S</div>
      <div id="btn-right" class="dpad-btn">D</div>
    </div>

    <a-entity id="rig" geometry="primitive: sphere; radius: 0.6" material="visible: false" position="0 0.6 22" 
              dynamic-body="mass: 70; shape: sphere; sphereRadius: 0.4; linearDamping: 0.9" physics-movement="force: 1200">
      
      <a-camera id="player-camera" position="0 1.0 0" look-controls="pointerLockEnabled: true" wasd-controls-enabled="false">
        <a-entity id="linterna-pc" light="type: spot; color: #e6f2ff; intensity: 0; angle: 40; penumbra: 0.3; distance: 25; decay: 1.5"></a-entity>
        
        <a-entity cursor="rayOrigin: entity; fuse: false" position="0 0 -1"
                  raycaster="objects: .scrap, .note; far: 2"
                  geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.015"
                  material="color: #00ffcc; shader: flat; opacity: 0.7"></a-entity>
      </a-camera>

      <a-entity id="left-controller" 
                laser-controls="hand: left" 
                oculus-touch-controls="hand: left"
                vr-joystick-movement
                raycaster="objects: .scrap, .note; far: 3" 
                line="color: #00ffcc; opacity: 0.5" 
                haptics="events: low-battery-pulse; dur: 300; force: 0.6">
        <a-entity id="vr-wrist-hud" position="0 0.12 -0.05" rotation="-45 0 0" visible="false">
          <a-plane width="0.12" height="0.06" color="#000f0a" material="opacity: 0.9"></a-plane>
          <a-text id="vr-loot-count" value="OBJ: 0/5" position="-0.05 0.015 0.001" scale="0.1 0.1 0.1" color="#00ffcc"></a-text>
          <a-text id="vr-battery-level" value="BAT: 100%" position="-0.05 -0.015 0.001" scale="0.1 0.1 0.1" color="#00ffcc"></a-text>
        </a-entity>

        <a-entity id="vr-inspector-container" visible="false" position="0.1 0.15 -0.1" rotation="-30 45 0">
          <a-image id="vr-inspector" width="0.45" height="0.6"></a-image>
          <a-text value="GATILLO PARA GUARDAR" position="0 -0.35 0" align="center" scale="0.12 0.12 0.12" color="#ff3333"></a-text>
        </a-entity>
      </a-entity>

      <a-entity id="right-controller" 
                laser-controls="hand: right" 
                oculus-touch-controls="hand: right"
                vr-snap-turn="angle: 45"
                raycaster="objects: .scrap, .note; far: 3" 
                line="color: #00ffcc; opacity: 0.5" 
                haptics="events: low-battery-pulse; dur: 300; force: 0.6">
        <a-entity id="linterna-vr" light="type: spot; color: #e6f2ff; intensity: 0; angle: 40; penumbra: 0.3; distance: 25; decay: 1.5" position="0 0 0" rotation="-15 0 0"></a-entity>
      </a-entity>
    </a-entity>

    <a-entity id="vr-controls-sign" position="0 2 20.5" visible="false">
      <a-plane width="3" height="1.8" color="#000f0a" material="opacity: 0.9"></a-plane>
      <a-text value="PROTOCOLO VR ACTIVO" position="0 0.6 0.05" align="center" width="4" color="#ff3333"></a-text>
      <a-text value="IZQ: MOVERSE | DER: GIRAR CAMARA\nAMBAS MANOS: INTERACTUAR\nLINTERNA: BOTONES A/B/X\nINFO HUD (Bateria y Obj): BOTON Y\nGUARDAR NOTA: GATILLO" 
              position="0 -0.1 0.05" align="center" width="3" color="#00ffcc"></a-text>
      <a-text value="EL MIMICO SOLO SE DETIENE SI LO MIRAS." position="0 -0.6 0.05" align="center" width="2.5" color="#ff3333"></a-text>
    </a-entity>

    <a-sky color="#020202"></a-sky>
    <a-box static-body position="0 -0.5 0" width="50" height="1" depth="50" color="#0a0a0a"></a-box>
    <a-box static-body position="0 5 0" width="50" height="1" depth="50" color="#000000"></a-box>

    <a-box class="wall" static-body position="0 2.5 -25" width="52" height="6" depth="2" color="#111"></a-box>
    <a-box class="wall" static-body position="0 2.5 25" width="52" height="6" depth="2" color="#111"></a-box>
    <a-box class="wall" static-body position="-25 2.5 0" width="2" height="6" depth="52" color="#111"></a-box>
    <a-box class="wall" static-body position="25 2.5 0" width="2" height="6" depth="52" color="#111"></a-box>

    <a-box class="wall" static-body position="0 2.5 15" width="2" height="6" depth="10" color="#141414"></a-box>
    <a-box class="wall" static-body position="-16 2.5 10" width="18" height="6" depth="2" color="#141414"></a-box>
    <a-box class="wall" static-body position="16 2.5 10" width="18" height="6" depth="2" color="#141414"></a-box>
    <a-box class="wall" static-body position="-10 2.5 6" width="2" height="6" depth="8" color="#141414"></a-box>
    <a-box class="wall" static-body position="-10 2.5 -6" width="2" height="6" depth="8" color="#141414"></a-box>
    <a-box class="wall" static-body position="10 2.5 6" width="2" height="6" depth="8" color="#141414"></a-box>
    <a-box class="wall" static-body position="10 2.5 -6" width="2" height="6" depth="8" color="#141414"></a-box>
    <a-box class="wall" static-body position="-16 2.5 -10" width="18" height="6" depth="2" color="#141414"></a-box>
    <a-box class="wall" static-body position="16 2.5 -10" width="18" height="6" depth="2" color="#141414"></a-box>
    <a-box class="wall" static-body position="0 2.5 -20" width="2" height="6" depth="10" color="#141414"></a-box>
    <a-box class="wall" static-body position="-18 2.5 0" width="2" height="6" depth="8" color="#141414"></a-box>
    <a-box class="wall" static-body position="18 2.5 0" width="2" height="6" depth="8" color="#141414"></a-box>

    <a-entity light="type: ambient; color: #ffffff; intensity: 0.15"></a-entity>
    <a-entity light="type: point; color: #ff3300; intensity: 0.5; distance: 15; decay: 2" position="0 4 0"></a-entity>

    <a-entity id="enemy" geometry="primitive: sphere; radius: 0.6" material="visible: false" position="-8 0.6 -20" 
              dynamic-body="mass: 100; shape: sphere; sphereRadius: 0.4; linearDamping: 0.9" stalker-ai="force: 1800">
      <a-cylinder radius="0.25" height="1.8" position="0 0.3 0" color="#0a0a0a"></a-cylinder>
      <a-sphere radius="0.3" position="0 1.2 0" color="#ff0000" material="emissive: #ff0000; emissiveIntensity: 1"></a-sphere>
    </a-entity>

    <a-box class="scrap" recolectable position="22 0.5 22" color="#00ffcc" scale="0.4 0.4 0.4"></a-box>
    <a-cylinder class="scrap" recolectable position="-22 0.5 22" radius="0.2" height="0.5" color="#00ffcc"></a-cylinder>
    <a-sphere class="scrap" recolectable position="-22 0.5 -22" radius="0.25" color="#00ffcc"></a-sphere>
    <a-tetrahedron class="scrap" recolectable position="22 0.5 -22" radius="0.3" color="#00ffcc"></a-tetrahedron>
    <a-dodecahedron class="scrap" recolectable position="0 0.5 0" radius="0.3" color="#00ffcc"></a-dodecahedron>

    <a-box class="note" nota-interactiva="img: concepts/2.png" position="0 1.5 23.95" rotation="0 180 0" depth="0.05" height="0.8" width="0.6" material="color: #fff"></a-box>
    <a-box class="note" nota-interactiva="img: concepts/6.png" position="-8 0.05 12" rotation="0 45 0" depth="0.6" height="0.05" width="0.8"></a-box>
    <a-box class="note" nota-interactiva="img: concepts/8.png" position="1.05 1.5 18" rotation="0 90 0" depth="0.05" height="0.8" width="0.6"></a-box>
    <a-box class="note" nota-interactiva="img: concepts/10.png" position="17 1.5 -8.95" rotation="0 0 0" depth="0.05" height="0.8" width="0.6"></a-box>
    <a-box class="note" nota-interactiva="img: concepts/11.png" position="-22 0.05 -18" rotation="0 -20 0" depth="0.6" height="0.05" width="0.8"></a-box>
    <a-box class="note" nota-interactiva="img: concepts/1.png" position="-11.05 1.5 6" rotation="0 -90 0" depth="0.05" height="0.8" width="0.6"></a-box>
    <a-box class="note" nota-interactiva="img: concepts/3.png" position="11.05 1.5 6" rotation="0 90 0" depth="0.05" height="0.8" width="0.6"></a-box>
    <a-box class="note" nota-interactiva="img: concepts/4.png" position="-1.05 1.5 -18" rotation="0 -90 0" depth="0.05" height="0.8" width="0.6"></a-box>
    <a-box class="note" nota-interactiva="img: concepts/5.png" position="-16.95 1.5 0" rotation="0 90 0" depth="0.05" height="0.8" width="0.6"></a-box>
    <a-box class="note" nota-interactiva="img: concepts/7.png" position="8 1.5 -23.95" rotation="0 0 0" depth="0.05" height="0.8" width="0.6"></a-box>
    <a-box class="note" nota-interactiva="img: concepts/9.jpg" position="23.95 1.5 -15" rotation="0 -90 0" depth="0.05" height="0.8" width="0.6"></a-box>
  </a-scene>

  <div id="image-inspector">
    <img id="inspector-img" src="" alt="Documento">
    <button id="btn-close-inspector">CERRAR ARCHIVO</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
